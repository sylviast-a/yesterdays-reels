<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Yesterday’s Reels Licensing — Catalogue Generator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      line-height: 1.4;
      background: #111;
      color: #eee;
    }
    header {
      padding: 24px 16px;
      border-bottom: 1px solid #333;
      background: #181818;
    }
    main {
      padding: 16px;
      max-width: 980px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px 0; font-size: 1.5rem; }
    h2 { color: #fff; }
    .sub {
      margin: 0;
      color: #bbb;
      max-width: 70ch;
    }
    .panel {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      margin-top: 16px;
    }
    @media (min-width: 860px) {
      .panel { grid-template-columns: 320px 1fr; }
    }
    .card {
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      background: #1a1a1a;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    label { font-size: 0.9rem; color: #ccc; }
    input, select, textarea, button {
      font: inherit;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #222;
      color: #eee;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      cursor: pointer;
      background: #eee;
      color: #111;
      border: 1px solid #eee;
    }
    button.secondary {
      background: #222;
      color: #eee;
      border: 1px solid #444;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .output {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      color: #ddd;
    }
    .hr { height: 1px; background: #333; margin: 12px 0; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid #444;
      border-radius: 999px;
      font-size: 0.78rem;
      color: #aaa;
      background: #222;
    }
  </style>
</head>
<body>
  <header>
    <h1>Yesterday’s Reels Licensing — Catalogue Generator</h1>
    <p class="sub">
      Generates plausible “overlooked indie” catalogue entries with institutional sincerity and a suspicious abundance of quiet regret.
      <span class="pill">static</span>
      <span class="pill">no backend</span>
      <span class="pill">existential</span>
    </p>
  </header>

  <main>
    <div class="panel">
      <section class="card">
        <h2 style="margin-top:0;">Generate</h2>

        <div class="row">
          <div>
            <label for="count">How many films?</label>
            <input id="count" type="number" min="1" max="50" value="5" />
          </div>
          <div>
            <label for="tone">Catalogue bias</label>
            <select id="tone">
              <option value="default" selected>Default (mostly drama)</option>
              <option value="lessDrama">Less drama (more variety)</option>
              <option value="maxBeige">Max existential beige</option>
            </select>
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <div>
            <label for="ratingMode">Rating mode</label>
            <select id="ratingMode">
              <option value="auto" selected>Auto by genre</option>
              <option value="any">Anything goes</option>
              <option value="family">Family-friendly bias</option>
            </select>
          </div>
          <div>
            <label for="yearMode">Year range</label>
            <select id="yearMode">
              <option value="classic" selected>1995–2012</option>
              <option value="nineties">1995–1999</option>
              <option value="aughts">2000–2009</option>
              <option value="tens">2010–2012</option>
            </select>
          </div>
        </div>

        <div style="margin-top:10px;">
          <label for="seed">Optional seed</label>
          <input id="seed" type="text" placeholder="arkon-quiet-bus" />
        </div>

        <div class="btns" style="margin-top:12px;">
          <button id="btnGen">Generate</button>
          <button id="btnCopy" class="secondary" disabled>Copy</button>
          <button id="btnClear" class="secondary">Clear</button>
        </div>
      </section>

      <section class="card">
        <h2 style="margin-top:0;">Output</h2>
        <div id="out" class="output">Click Generate.</div>
      </section>
    </div>
  </main>

<script>
function hashStringToUint32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randFloat(rng) { return rng ? rng() : Math.random(); }
function pick(arr, rng) { return arr[Math.floor(randFloat(rng) * arr.length)]; }
function chance(p, rng) { return randFloat(rng) < p; }

const GENRES = [
  "Drama","Drama / Romance","Drama / Mystery","Drama / Thriller",
  "Drama / Comedy","Drama / Experimental","Animated / Drama","Action / Drama"
];

const RATINGS = ["G","PG","PG-13","R"];

const SETTING = [
  "small apartment","bus stop","airport","hospital","diner","used bookstore",
  "park bench","garage","clock shop","factory","beach house","library","car at night"
];

const CHARACTER = [
  "young woman","middle-aged man","divorced couple","father and son",
  "two siblings","strangers","delivery driver","radio host",
  "substitute teacher","nervous teen","elderly neighbor","local man"
];

const BEATS = [
  "long conversation about regrets",
  "awkward small talk turns personal",
  "quiet argument in a kitchen",
  "power goes out and people talk in the dark",
  "a reunion that feels wrong",
  "a near encounter that goes nowhere"
];

const ENDINGS = [
  "They leave before morning.",
  "Nothing is resolved.",
  "They stop trying.",
  "He returns to work.",
  "She moves out.",
  "The lights go out."
];

function makeTitle(rng) {
  const parts = [
    pick(["The","A","Midnight","Winter","Summer","April"], rng),
    pick(["Last","Quiet","Empty","Blue","Waiting","Broken"], rng),
    pick(["Bus","Bench","Signal","Field","Room","Library","Weekend"], rng)
  ];
  return parts.join(" ");
}

function makeSynopsis(genre, rng) {
  const s = [];
  s.push(`One night.`);
  s.push(`A ${pick(CHARACTER, rng)} waits in a ${pick(SETTING, rng)}.`);
  s.push(`${pick(BEATS, rng)}.`);
  if (genre.includes("Romance")) {
    s.push(`They talk about what might have been.`);
  }
  s.push(pick(ENDINGS, rng));
  return s.join(" ");
}

function generateFilm(rng) {
  const title = makeTitle(rng);
  const year = 1995 + Math.floor(randFloat(rng) * 18);
  const genre = pick(GENRES, rng);
  const runtime = 86 + Math.floor(randFloat(rng) * 20);
  const rating = pick(RATINGS, rng);
  const synopsis = makeSynopsis(genre, rng);
  return { title, year, runtime, genre, rating, synopsis };
}

function formatFilm(f) {
  return `${f.title} (${f.year})
Runtime: ${f.runtime} min
Genre: ${f.genre}
Rating: ${f.rating}
“${f.synopsis}”`;
}

document.getElementById("btnGen").onclick = () => {
  const n = parseInt(document.getElementById("count").value || "5", 10);
  const seed = document.getElementById("seed").value.trim();
  const rng = seed ? mulberry32(hashStringToUint32(seed)) : null;

  const films = [];
  for (let i = 0; i < n; i++) films.push(generateFilm(rng));
  document.getElementById("out").textContent =
    "Available Film Catalogue\n\n" + films.map(formatFilm).join("\n\n");
  document.getElementById("btnCopy").disabled = false;
};

document.getElementById("btnClear").onclick = () => {
  document.getElementById("out").textContent = "Click Generate.";
  document.getElementById("btnCopy").disabled = true;
};

document.getElementById("btnCopy").onclick = () => {
  navigator.clipboard.writeText(document.getElementById("out").textContent);
};
</script>
</body>
</html>
